# This workflow runs whenever a PR is opened or updated, or a commit is pushed to main. It runs
# several checks:
# - fmt: checks that the code is formatted according to rustfmt
# - clippy: checks that the code does not contain any clippy warnings
# - doc: checks that the code can be documented without errors
# - hack: check combinations of feature flags
# - msrv: check that the msrv specified in the crate is correct
permissions:
  contents: read
# This configuration allows maintainers of this repo to create a branch and pull request based on
# the new branch. Restricting the push trigger to the main branch ensures that the PR only gets
# built once.
on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: check
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: stable / fmt
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check
  clippy:
    runs-on: ubuntu-latest
    name: ${{ matrix.toolchain }} / clippy
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # Get early warning of new lints which are regularly introduced in beta channels.
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Dependencies
        run: | 
          sudo apt install -y llvm-18 libclang-18-dev
          sudo ldconfig          
      - name: Run clippy
        run: cargo clippy --all-targets --workspace
  lockstep:
    runs-on: ubuntu-latest
    name: stable / datafusion-ballista lockstep
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Assert datafusion and ballista-core major versions match
        run: |
          python3 - <<'PYEOF'
          import re
          import sys


          def parse_lock_versions(path: str) -> dict:
              lock = open(path).read()
              versions = {}
              for m in re.finditer(
                  r'^name = "([^"]+)"\nversion = "([^"]+)"', lock, re.M
              ):
                  # keep the highest version if a crate appears multiple times
                  name, version = m.group(1), m.group(2)
                  if name not in versions or version > versions[name]:
                      versions[name] = version
              return versions


          versions = parse_lock_versions("Cargo.lock")
          datafusion = versions.get("datafusion")
          ballista = versions.get("ballista-core")

          if datafusion is None:
              print("datafusion not found in Cargo.lock")
              sys.exit(1)

          if ballista is None:
              print(
                  "ballista-core is not in the dependency tree yet; "
                  f"nothing to compare against datafusion {datafusion}"
              )
              sys.exit(0)

          df_major = datafusion.split(".")[0]
          ballista_major = ballista.split(".")[0]
          print(f"datafusion={datafusion} ballista-core={ballista}")
          if df_major != ballista_major:
              print(
                  f"ERROR: ballista-core major ({ballista_major}) != "
                  f"datafusion major ({df_major}). Ballista and DataFusion "
                  "must be bumped in lockstep, every major, in the same release."
              )
              sys.exit(1)
          print("lockstep check passed")
          PYEOF
