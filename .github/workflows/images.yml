name: images

on:
  workflow_dispatch:
  push:
    branches: [m15-shares]
    paths:
      - 'docker/**'
      - '.github/workflows/images.yml'
    tags: ['v*']

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUST_TOOLCHAIN: "1.96.0"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: embucketd
            package: embucketd
            features: state-store,state-store-query,queries
          - image: avalanche-scheduler
            package: avalanche-scheduler
            features: ""
          - image: avalanche-executor
            package: avalanche-executor
            features: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.image }}

      - name: Build release binary
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release -p ${{ matrix.package }} --features ${{ matrix.features }}
          else
            cargo build --release -p ${{ matrix.package }}
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/m15-shares' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}