[workspace]
default-members = ["crates/embucketd"]
members = [
  "crates/embucketd",
  "crates/api-snowflake-rest",
  "crates/api-snowflake-rest-sessions",
  "crates/executor",
  "crates/catalog-metastore",
  "crates/catalog",
  "crates/functions",
  "crates/queries",
  "crates/error-stack",
  "crates/error-stack-trace",
  "crates/embucket-lambda",
  "crates/state-store",
  "crates/avalanche-warehouse",
  "crates/avalanche-executor-common",
  "crates/avalanche-scheduler",
  "crates/avalanche-cluster-store",
  "crates/avalanche-cluster-store",
  "crates/avalanche-executor",
  "crates/avalanche-account",
  "crates/build-info",
]
resolver = "2"
package.license-file = "LICENSE"

[profile.dev]
# Full debuginfo ballooned target/debug past 100 GB. Line tables keep
# function names + line numbers in backtraces (gdb) at a fraction of the
# size; variable inspection is sacrificed.
debug = "line-tables-only"

# Dependency rlibs don't need debuginfo at all — they dominate artifact
# size and are rarely the code under inspection.
[profile.dev.package."*"]
debug = false

[profile.test]
incremental = true
opt-level = 1
debug = "line-tables-only"
codegen-units = 16

[profile.ci]
inherits = "test"
lto = "off"
debug = false

[workspace.dependencies]
queries = { path = "crates/queries" }
async-trait = { version = "0.1.84" }
aws-config = { version = "1.5.17" }
aws-sdk-s3tables = { version = "1.47.0" }
aws-credential-types = { version = "1.2.11",  features = ["hardcoded-credentials"]}
axum = { version = "0.8.1", features = ["multipart", "macros"] }
axum-macros = "0.5"
bytes = { version = "1.8.0" }
chrono = { version = "0.4.41", default-features = false, features = ["serde",  "clock"] }
clap = { version = "4.5.27", features = ["env", "derive"] }
dashmap = "6.1.0"
datafusion = { version = "55.0.0" }
datafusion-common = { version = "55.0.0" }
datafusion-doc = { version = "55.0.0" }
datafusion-expr = { version = "55.0.0" }
datafusion-functions-json = { git = "https://github.com/Embucket/datafusion-functions-json.git", branch = "embucket-sync-df55.0.0" }
datafusion-macros = { version = "55.0.0" }
datafusion-physical-plan = { version = "55.0.0" }
datafusion_iceberg = { git = "https://github.com/Embucket/iceberg-rust.git", branch = "embucket-sync-df55.0.0" }
futures = { version = "0.3" }
http = "1.2"
http-body-util = "0.1.0"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev="7a5ad1fcaf00d4638857812bab788105f6c60573"}
iceberg-rest-catalog = { git = "https://github.com/Embucket/iceberg-rust.git", branch = "embucket-sync-df55.0.0" }
iceberg-rust = { git = "https://github.com/Embucket/iceberg-rust.git", branch = "embucket-sync-df55.0.0" }
iceberg-rust-spec = { git = "https://github.com/Embucket/iceberg-rust.git", branch = "embucket-sync-df55.0.0" }
iceberg-s3tables-catalog = { git = "https://github.com/Embucket/iceberg-rust.git", branch = "embucket-sync-df55.0.0" }
indexmap = "2.7.1"
jsonwebtoken = "9.3.1"
lazy_static = { version = "1.5" }
# Should be updated to 0.12.0 after slate db update
object_store = { version = "0.13.0", features = ["aws", "gcp", "azure"] }
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive", "alloc"] }
serde_json = { version = "1.0.145", features = ["raw_value"]}
serde_yaml = "0.9"
snafu = { version = "0.8.5", features = ["futures"] }
tikv-jemallocator = { version = "0.6.0" }
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = { version = "0.27.2" }
tar = "0.4.44"
tempfile = { version = "3" }
time = "0.3.37"
tokio-util = "0.7.16"
tokio = { version = "1", features = ["full", "tracing"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.1", features = [
  "catch-panic",
  "timeout",
  "sensitive-headers",
  "cors",
  "trace",
  "compression-full",
  "decompression-full"
] }
tower-sessions = { version = "0.14.0" }
tracing = { version = "0.1", features = ["attributes"] }
tracing-attributes = { version = "0.1.28" }
url = "2.5"
utoipa = { version = "5.3.1", features = ["uuid", "chrono"] }
utoipa-axum = { version = "0.2.0" }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1.10.0", features = ["v4", "v7", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
mockall = "0.14.0"
insta = { version = "1.44.1", features = ["json", "filters", "redactions"] }
cfg-if = { version = "1.0.3" }

[patch.crates-io]
# Unify Arrow on the Embucket fork (required by datafusion fork's df55 branch);
# without this the registry arrow 59.3 duplicates the git arrow 59.2 types.
arrow = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-arith = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-array = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-buffer = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-cast = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-csv = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-data = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-ipc = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-json = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-ord = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-row = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-schema = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-select = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
arrow-string = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
parquet = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
parquet-variant = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
parquet-variant-compute = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
parquet-variant-json = { git = "https://github.com/Embucket/arrow-rs.git", rev = "539206bde" }
datafusion = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }
datafusion-common = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }
datafusion-expr = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }
datafusion-physical-plan = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }
datafusion-doc = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }
datafusion-macros = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }
# Ballista (crates.io) pulls datafusion-proto from the registry, which drags in
# the whole registry datafusion sub-crate family and forks the types; use the
# fork's proto crates so all datafusion types stay unified.
datafusion-proto = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }
datafusion-proto-common = { git = "https://github.com/DeanKamali/datafusion.git", branch = "embucket-sync-df55.0.0" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = 1 }
as_conversions = "warn"
nursery = { level = "warn", priority = 1 }
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
similar_names = { level = "allow", priority = 2 }

# These should be removed eventually
missing_errors_doc = { level = "allow", priority = 2 }
missing_panics_doc = { level = "allow", priority = 2 }
significant_drop_tightening = { level = "allow", priority = 2 }
module_name_repetitions = { level = "allow", priority = 2 }
option_if_let_else = { level = "allow", priority = 2 }
needless_for_each = { level = "allow", priority = 2 } #  #[derive(OpenApi)]

