{{/* Auth + state-store DSN. The router is stateless: everything durable
lives in PG and is replayed on startup, so this Secret is the only place
credentials exist. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avalanche.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "avalanche.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.router.auth.jwtSecret | quote }}
  AUTH_DEMO_USER: {{ .Values.router.auth.demoUser | quote }}
  AUTH_DEMO_PASSWORD: {{ .Values.router.auth.demoPassword | quote }}
  STATESTORE_PG_URL: {{ printf "postgres://%s:%s@%s-pg:%s/%s" .Values.statestore.username .Values.statestore.password (include "avalanche.fullname" .) (.Values.statestore.servicePort | toString) .Values.statestore.database | quote }}