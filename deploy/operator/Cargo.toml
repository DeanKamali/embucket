[package]
name = "avalanche-operator"
version = "0.1.0"
edition = "2021"
description = "AvalancheWarehouse CRD + controller skeleton (v2 spike)"

# Standalone crate: not a workspace member of the engine (kube-rs pulls a
# large dep tree the engine build should not carry).
[workspace]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
futures = "0.3"
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "avalanche-operator"
path = "src/main.rs"